[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "https-pymongo"
version = "0.2.0"
description = "PyMongo and Motor compatible client facade that sends database calls over HTTPS"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["client/src"]
include = ["pymongo*", "motor*", "bson*"]

[tool.setuptools.package-dir]
"" = "client/src"
